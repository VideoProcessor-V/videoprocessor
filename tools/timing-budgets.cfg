# Timing budgets for the Beta timing gate (owner 2026-10-13: every component
# and combination within budget, no hiccups). Read by the Beta suite with
# VP_TEST_TIMING_GATE=1 VP_TEST_GPU=hardware (src/VideoProcessor-BetaTests,
# RunBetaTimingGate); VP_TEST_BUDGETS=<path> overrides this file.
#
# A section applies when its name is part of the GPU's name. Keys:
#   [half:|full:]<series>.<p99|max|mean> = ms
#   [half:|full:]pass:<pass name part>.mean = ms   (GPU per source frame, all its refreshes)
# The scope is the run's matcher size (half = dejudder_low_res all / search,
# full = off); a key without one applies to every run. Series (ms, each
# drained, 4K or 1080p to 2560x1600, 23.976p at 59.94 Hz with extras):
#   matcher             the motion estimate per source frame (before the frame)
#   new_frame           a new frame's render
#   extra               a de-judder extra's render
#   repeat              a cadence repeat's render (30p clip only)
#   critical            the new frame's refresh: its render (+ the matcher unless ahead)
#   extra_with_matcher  the extra that holds the matcher (estimate ahead)
#   any_slot            every refresh slot
#   source_frame        a source frame's whole work
# The combinations: SDR / HDR, matcher all / off, estimate ahead on / off,
# chroma Catmull-Rom / the upscaler, on the synthetic 4K and 1080p sequences,
# and the owner's clip (as 23.976p, SDR and pseudo-HDR, ahead on / off).

# The development laptop: a regression guard (the measured worst of
# 2026-10-13 + 25% at p99, + 50% at the maximum; this GPU's clock alone moves
# the times by 20-30% between runs). It cannot play 4K in real time.
[RTX 3050 Ti]
half:matcher.p99 = 18
half:matcher.max = 22
half:new_frame.p99 = 45
half:new_frame.max = 57
half:extra.p99 = 9
half:extra.max = 20
half:critical.p99 = 62
half:critical.max = 78
half:extra_with_matcher.p99 = 24
half:extra_with_matcher.max = 31
half:source_frame.p99 = 73
half:source_frame.max = 95
half:any_slot.p99 = 62
half:any_slot.max = 78
full:matcher.p99 = 64
full:matcher.max = 79
full:new_frame.p99 = 45
full:new_frame.max = 57
full:extra.p99 = 8
full:extra.max = 11
full:critical.p99 = 106
full:critical.max = 130
full:extra_with_matcher.p99 = 70
full:extra_with_matcher.max = 86
full:source_frame.p99 = 116
full:source_frame.max = 141
full:any_slot.p99 = 104
full:any_slot.max = 130

# The cinema PC: the requirement itself. Every refresh inside a 59.94 Hz
# refresh (16.68 ms) with 2 ms to spare, a source frame inside its 23.976p
# period (41.7 ms), for the default matcher size. Regression budgets from the
# first measured run are added below these when it is done.
[RTX 3090]
half:critical.max = 14.6
half:extra.max = 14.6
half:extra_with_matcher.max = 14.6
half:any_slot.max = 14.6
half:source_frame.max = 41.7
