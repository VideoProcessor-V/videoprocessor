name: ci-windows

# Safety net for the owner's fork: x64 Release build of VideoProcessor.sln and the
# CPU test suite on GitHub's Windows runners (no GPU, no capture card, no footage).
#
# Jobs: build (scope, incremental build, uploads the x64 Release outputs and the shard
# plan) -> up to six CPU test shards and the Qt config editor tests in parallel ->
# test-summary (merges the shard TRX files and fails unless every planned test ran
# exactly once and passed).
#
# Tiers (tools/ci/select_ci_scope.ps1, docs/CI.md): feature branches (fix/, feat/, test/,
# research/) build the changed projects and run the test classes that depend on them;
# ci/* branches, workflow_dispatch with full: true, the nightly schedule, other branches
# and any change that cannot be mapped run everything. No test is excluded by name.
#
# Differences from the local build (see the "Toolchain" step output):
#  - Built with /p:VpCiNoMagewell=true: the proprietary MWCapture SDK headers are
#    not available here, so the Magewell backend compiles to a no-device stub and
#    its tests are left out. Nothing licensed is downloaded or committed.
#  - Visual Studio 18 Enterprise (runner image) vs 18 Community locally. The image
#    lacks v142 ATL/MFC: the job restores it from the Actions cache (keyed by the
#    runner image and Visual Studio version) or installs it; the projects' own
#    v142/v143 toolsets are then used. Windows SDK 10.0.19041 is absent, so the job
#    overrides WindowsTargetPlatformVersion to the newest installed SDK.
#  - Qt 6.8.3 msvc2022_64 comes from install-qt-action (cached), passed as VP_QT_ROOT.
#  - Tests: RendererCaptureHarnessTests (GpuHardware / GpuOnScreen) are not planned;
#    libplacebo tests run on WARP or skip; footage tests skip (no D:\hfr). Tests whose
#    hardware precondition is missing here (desktop size, CPU class, hardware D3D11
#    renderer) detect it themselves and log SKIP-NO-HARDWARE, which the summary lists
#    by name. Locally VP_TEST_REQUIRE_HARDWARE=1 makes the same tests fail instead.

on:
  push:
    branches:
      - '**'
  # Nightly full run on the default branch (GitHub runs schedules there only): keeps the Actions
  # caches that every branch may restore (default-branch caches) warm. See docs/CI.md.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Full tier: build everything and run the whole sharded suite'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  TEST_SHARDS: '6'

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      vstest: ${{ steps.toolchain.outputs.vstest }}
      mode: ${{ steps.scope.outputs.mode }}
      cpu: ${{ steps.plan.outputs.cpu }}
      matrix: ${{ steps.plan.outputs.matrix }}
      config: ${{ steps.scope.outputs.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Tier: full (ci/* branches, workflow_dispatch full, non-feature branches, anything unmappable)
      # or affected (feature branches: only the changed projects and the test classes that depend
      # on them). See tools/ci/select_ci_scope.ps1 and docs/CI.md.
      - name: Scope
        id: scope
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-plan | Out-Null
          $full = ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.full }}' -eq 'true') -or '${{ github.event_name }}' -eq 'schedule'
          & .\tools\ci\select_ci_scope.ps1 -Branch '${{ github.ref_name }}' -OutFile ci-plan\scope.json -Full:$full | Tee-Object -FilePath ci-plan\scope.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $scope = Get-Content ci-plan\scope.json -Raw | ConvertFrom-Json
          "mode=$($scope.mode)" >> $env:GITHUB_OUTPUT
          "projects=$(@($scope.projects) -join ';')" >> $env:GITHUB_OUTPUT
          "config=$(([string]$scope.configTests).ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "cpu=$(([string]$scope.cpuTests).ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          @($scope.testClasses) | Set-Content ci-plan\classes.txt
          $fence = '```'
          "### Scope: $($scope.mode)`n$fence`n$((Get-Content ci-plan\scope.txt) -join "`n")`n$fence" >> $env:GITHUB_STEP_SUMMARY

      - name: Install Qt
        if: steps.scope.outputs.mode != 'none'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Locate Visual Studio
        id: vs
        if: steps.scope.outputs.mode != 'none'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsVersion = & $vswhere -latest -products * -property catalog_productDisplayVersion
          $v142 = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\14.29.*') -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
          $atlmfc = if ($v142) { Join-Path $v142.FullName 'atlmfc' } else { '' }
          Write-Host "Visual Studio: $vs ($vsVersion); v142 ATL/MFC path: $atlmfc; image $env:ImageVersion"
          "path=$vs" >> $env:GITHUB_OUTPUT
          "version=$vsVersion" >> $env:GITHUB_OUTPUT
          "atlmfc=$atlmfc" >> $env:GITHUB_OUTPUT

      # The v142 ATL/MFC components add their files under VC\Tools\MSVC\14.29.*\atlmfc, so that
      # folder is cached; the key changes with the runner image and the Visual Studio version.
      - name: Cache v142 ATL/MFC
        id: atlmfc-cache
        if: steps.scope.outputs.mode != 'none' && steps.vs.outputs.atlmfc != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vs.outputs.atlmfc }}
          key: v142-atlmfc-${{ runner.os }}-${{ env.ImageVersion }}-vs${{ steps.vs.outputs.version }}-14.29.16.11

      - name: Toolchain
        id: toolchain
        if: steps.scope.outputs.mode != 'none'
        shell: pwsh
        run: |
          $vs = '${{ steps.vs.outputs.path }}'
          $vsVersion = '${{ steps.vs.outputs.version }}'
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          $vstest = Get-ChildItem (Join-Path $vs 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe') | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "MSBuild: $msbuild"; Write-Host "vstest: $vstest"
          $toolsets = Get-ChildItem (Join-Path $vs 'MSBuild\Microsoft\VC\*\Platforms\x64\PlatformToolsets\*') -Directory | ForEach-Object Name
          Write-Host "Platform toolsets: $($toolsets -join ', ')"
          $msvc = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory | ForEach-Object Name
          Write-Host "MSVC tools: $($msvc -join ', ')"
          $mfc142 = @(Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\14.29.*\atlmfc\lib\x64\mfc140u.lib') -ErrorAction SilentlyContinue).Count -gt 0
          $atlSource = if ('${{ steps.atlmfc-cache.outputs.cache-hit }}' -eq 'true') { 'restored from the Actions cache' } elseif ($mfc142) { 'runner image' } else { '' }
          Write-Host "v142 (14.29) MFC present: $mfc142 $atlSource"
          if (($toolsets -contains 'v142') -and -not $mfc142) {
            # The image has the v142 compiler but not its ATL/MFC; the MFC projects (Lib, GUI,
            # renderers, tests) target v142 as locally, so add the same two components.
            Write-Host "Installing v142 ATL/MFC (14.29) components"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
            $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @('modify', '--installPath', "`"$vs`"",
              '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL',
              '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC',
              '--quiet', '--norestart', '--nocache')
            Write-Host "vs_installer exit $($p.ExitCode) after $([int]$sw.Elapsed.TotalSeconds) s"
            $mfc142 = @(Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\14.29.*\atlmfc\lib\x64\mfc140u.lib') -ErrorAction SilentlyContinue).Count -gt 0
            $atlSource = "installed in $([int]$sw.Elapsed.TotalSeconds) s (cached for the next run)"
            Write-Host "v142 (14.29) MFC present after install: $mfc142"
          }
          $sdks = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | ForEach-Object Name | Sort-Object { [version]$_ }
          Write-Host "Windows SDKs: $($sdks -join ', ')"
          $extra = @()
          if (-not (($toolsets -contains 'v142') -and $mfc142)) {
            Write-Host "v142 with MFC unavailable: overriding PlatformToolset=v143"
            $extra += '/p:PlatformToolset=v143'
          }
          if (-not (($sdks -contains '10.0.19041.0') -and ($sdks -contains '10.0.26100.0'))) {
            $newest = $sdks | Where-Object { $_ -like '10.0.*' } | Select-Object -Last 1
            Write-Host "A targeted Windows SDK is missing: overriding WindowsTargetPlatformVersion=$newest"
            $extra += "/p:WindowsTargetPlatformVersion=$newest"
          }
          "msbuild=$msbuild" >> $env:GITHUB_OUTPUT
          "vstest=$vstest" >> $env:GITHUB_OUTPUT
          "extra=$($extra -join ' ')" >> $env:GITHUB_OUTPUT
          @"
          ### Toolchain
          | | |
          |---|---|
          | Visual Studio | $vsVersion |
          | Platform toolsets | $($toolsets -join ', ') |
          | MSVC tools | $($msvc -join ', ') |
          | v142 ATL/MFC | $(if ($mfc142) { $atlSource } else { 'unavailable' }) |
          | Windows SDKs | $($sdks -join ', ') |
          | Overrides | $(if ($extra) { $extra -join ' ' } else { 'none (project toolsets/SDKs used)' }) |
          | Qt | $env:QT_VERSION ($env:QT_ROOT_DIR) |
          "@ >> $env:GITHUB_STEP_SUMMARY

      # Earlier build outputs and every project's intermediate directory, keyed by the toolchain and
      # the project/solution/props files; the newest entry for the same key prefix is restored and
      # tools/ci/prepare_incremental_build.ps1 dates the sources so that MSBuild rebuilds exactly
      # what changed since the cached commit (or deletes the restore for a clean build).
      - name: Restore build outputs
        id: build-cache
        if: steps.scope.outputs.mode != 'none'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            x64/Release
            src/*/x64/Release
            3rdparty/*/x64/Release
          key: vp-build-${{ env.ImageVersion }}-vs${{ steps.vs.outputs.version }}-qt${{ env.QT_VERSION }}-${{ hashFiles('VideoProcessor.sln', '**/*.vcxproj', '**/*.props', '**/*.targets') }}-${{ github.run_id }}
          restore-keys: |
            vp-build-${{ env.ImageVersion }}-vs${{ steps.vs.outputs.version }}-qt${{ env.QT_VERSION }}-${{ hashFiles('VideoProcessor.sln', '**/*.vcxproj', '**/*.props', '**/*.targets') }}-

      - name: Prepare incremental build
        id: incremental
        if: steps.scope.outputs.mode != 'none'
        shell: pwsh
        run: |
          $line = & .\tools\ci\prepare_incremental_build.ps1
          $line
          "marker=$(if (Test-Path x64\Release\.ci-build-commit) { (Get-Content x64\Release\.ci-build-commit -Raw).Trim() })" >> $env:GITHUB_OUTPUT
          "### Build cache`n$line" >> $env:GITHUB_STEP_SUMMARY

      - name: Build (x64 Release, without Magewell)
        id: build
        if: steps.scope.outputs.mode != 'none'
        shell: pwsh
        env:
          VP_QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: |
          # tools/record_runtime_requirement.ps1 runs under Windows PowerShell 5.1 after each link;
          # pwsh's PSModulePath would make it load PowerShell 7 modules (Get-FileHash not found).
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          $sw = [Diagnostics.Stopwatch]::StartNew()
          # Always an array: splatting a single string would pass it character by character.
          $extra = @('${{ steps.toolchain.outputs.extra }}' -split ' ' | Where-Object { $_ })
          # Full tier: the whole solution. Affected tier: the changed projects (MSBuild builds their
          # references too).
          $targets = if ('${{ steps.scope.outputs.mode }}' -eq 'full') { 'Build' } else { '${{ steps.scope.outputs.projects }}' }
          Write-Host "MSBuild targets: $targets"
          & '${{ steps.toolchain.outputs.msbuild }}' VideoProcessor.sln "/t:$targets" /m /nr:false `
            /p:Configuration=Release /p:Platform=x64 /p:VpCiNoMagewell=true @extra /v:minimal
          $code = $LASTEXITCODE
          "Build ($targets): $([int]$sw.Elapsed.TotalMinutes) min $($sw.Elapsed.Seconds) s (exit $code)" | Tee-Object -FilePath build-time.txt
          "### Build`n$(Get-Content build-time.txt)" >> $env:GITHUB_STEP_SUMMARY
          exit $code

      # Hunt 2 platform (ABI): the EXE and both renderer DLLs must carry one build ID, and
      # packaging must refuse a mismatched pair. Runs where the binaries were built.
      - name: Build identity tests (EXE/DLL pairing, packaging)
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          # Same Windows PowerShell 5.1 as the packaging scripts (see the Build step).
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/test_build_identity.ps1 -BuildRoot x64/Release
          $code = $LASTEXITCODE
          "### Build identity tests`nexit $code" >> $env:GITHUB_STEP_SUMMARY
          exit $code

      # The marker names the commit every cached output matches. A full build sets it to HEAD; an
      # affected build left other projects as they were, so it keeps the restored marker (the next
      # run re-dates everything changed since then) and saves nothing when there was none.
      - name: Save build outputs
        if: steps.scope.outputs.mode != 'none' && (steps.scope.outputs.mode == 'full' || steps.incremental.outputs.marker != '')
        shell: pwsh
        run: |
          if ('${{ steps.scope.outputs.mode }}' -eq 'full') { (git rev-parse HEAD).Trim() | Set-Content -NoNewline x64\Release\.ci-build-commit }
          Write-Host "Cache marker: $((Get-Content x64\Release\.ci-build-commit -Raw).Trim())"

      - name: Upload build outputs to the cache
        if: steps.scope.outputs.mode != 'none' && (steps.scope.outputs.mode == 'full' || steps.incremental.outputs.marker != '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            x64/Release
            src/*/x64/Release
            3rdparty/*/x64/Release
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      # As many shards (at most TEST_SHARDS) as the measured load of the selected tests needs at
      # about five minutes each; the full tier plans every test.
      # Every test that uses the GPU needs a Category attribute or a manifest entry
      # (tools/test-categories.json); the shard plan below takes its exclusions from the generator
      # tools/gen_test_filters.py (tools/test_filters.ps1) and stops when python or the generator fails.
      - name: Check test categories
        if: steps.scope.outputs.cpu == 'true'
        shell: pwsh
        run: |
          python tools/check_test_categories.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Plan test shards
        id: plan
        if: steps.scope.outputs.cpu == 'true'
        shell: pwsh
        run: |
          & '${{ steps.toolchain.outputs.vstest }}' x64\Release\VideoProcessor-Test.dll /Platform:x64 `
            /ListFullyQualifiedTests /ListTestsTargetPath:ci-plan\tests.txt | Out-Null
          if (-not (Test-Path ci-plan\tests.txt)) { throw 'vstest wrote no test list' }
          $selection = if ('${{ steps.scope.outputs.mode }}' -eq 'affected') { @('-ClassesFile', 'ci-plan\classes.txt') } else { @() }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci\plan_test_shards.ps1 `
            -TestList ci-plan\tests.txt -Shards $env:TEST_SHARDS -TargetShardSeconds 300 -OutFile ci-plan\shards.json @selection |
            Tee-Object -FilePath ci-plan\plan.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $count = @((Get-Content ci-plan\shards.json -Raw | ConvertFrom-Json).shards).Count
          "cpu=true" >> $env:GITHUB_OUTPUT
          "matrix=$(ConvertTo-Json -Compress @(0..($count - 1)))" >> $env:GITHUB_OUTPUT
          $fence = '```'
          "### Test shard plan`n$fence`n$((Get-Content ci-plan\plan.txt) -join "`n")`n$fence" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test plan
        if: steps.scope.outputs.cpu == 'true' || steps.scope.outputs.config == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-plan
          path: ci-plan/
          if-no-files-found: error

      # Everything the tests load at run time; intermediates, import libraries and symbols stay.
      - name: Upload test binaries
        if: steps.scope.outputs.cpu == 'true' || steps.scope.outputs.config == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-binaries
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
          path: |
            x64/Release/
            ci-plan/
            !x64/Release/obj/
            !x64/Release/**/*.pdb
            !x64/Release/**/*.lib
            !x64/Release/**/*.exp
            !x64/Release/**/*.ilk
            !x64/Release/**/*.iobj
            !x64/Release/**/*.ipdb
            !x64/Release/**/*.obj

  cpu-tests:
    needs: build
    if: needs.build.outputs.cpu == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.matrix) }}
    name: cpu-tests (shard ${{ matrix.shard }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-binaries
          path: .

      - name: CPU tests (vstest)
        shell: pwsh
        run: |
          $shard = ${{ matrix.shard }}
          $plan = Get-Content ci-plan\shards.json -Raw | ConvertFrom-Json
          $s = @($plan.shards | Where-Object { $_.index -eq $shard })[0]
          $trxDir = Join-Path $env:GITHUB_WORKSPACE 'test-results'
          New-Item -ItemType Directory -Force $trxDir | Out-Null
          # Make sure no GPU/on-screen/footage/require switch leaks in from the image.
          foreach ($k in 'VP_TEST_GPU','VP_TEST_REQUIRE_GPU','VP_TEST_REQUIRE_HARDWARE','VP_TEST_HARNESS_ONSCREEN','VP_TEST_REAL_FOOTAGE','VP_PULLDOWN_RECORDINGS') {
            Remove-Item "Env:$k" -ErrorAction SilentlyContinue
          }
          Write-Host "Shard $shard of $(@($plan.shards).Count): $($s.tests) tests, planned $($s.weight) s"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & '${{ needs.build.outputs.vstest }}' x64\Release\VideoProcessor-Test.dll /Platform:x64 `
            "/TestCaseFilter:$($s.filter)" "/Logger:trx;LogFileName=cpu-tests-shard$shard.trx" "/ResultsDirectory:$trxDir"
          Write-Host "Shard $shard vstest: $([int]$sw.Elapsed.TotalMinutes) min $($sw.Elapsed.Seconds) s (exit $LASTEXITCODE)"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci\summarize_test_shards.ps1 `
            -Plan ci-plan\shards.json -TrxDir $trxDir -Shard $shard -Summary $env:GITHUB_STEP_SUMMARY
          exit $LASTEXITCODE

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-tests-trx-shard${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  config-tests:
    needs: build
    if: needs.build.outputs.config == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-binaries
          path: .

      - name: Config editor tests (Qt, off screen)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = Join-Path $env:GITHUB_WORKSPACE 'test-results\config-tests'
          # Off screen nothing takes focus, so the runner's four cores run four shards.
          & .\tools\run_config_tests.ps1 -Shards 4 -OutDir $out
          $code = $LASTEXITCODE
          "### Config editor tests`nexit $code, $([int]$sw.Elapsed.TotalMinutes) min $($sw.Elapsed.Seconds) s (logs in the config-tests artifact)" >> $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-tests
          path: test-results/
          if-no-files-found: ignore

  test-summary:
    needs: [build, cpu-tests]
    if: always() && needs.build.result == 'success' && needs.build.outputs.cpu == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download shard TRX files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpu-tests-trx-shard*
          path: test-results

      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-plan
          path: ci-plan

      - name: Test summary
        shell: pwsh
        run: |
          # Fails unless every planned test ran exactly once and passed; SKIP-NO-HARDWARE is listed
          # separately with the test names. test-weights.json is the measured input for the next
          # plan (tools/ci/test-weights.json).
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci\summarize_test_shards.ps1 `
            -Plan ci-plan\shards.json -TrxDir test-results -Summary $env:GITHUB_STEP_SUMMARY `
            -WeightsOut test-results\test-weights.json
          exit $LASTEXITCODE

      - name: Upload measured weights
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-tests-weights
          path: test-results/test-weights.json
          if-no-files-found: ignore
